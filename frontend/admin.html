<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DailyPilot Admin</title>
<link rel="stylesheet" href="style.css">
<style>
#app{max-width:1000px;padding-bottom:40px}
.top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 16px}
.top button{padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.top button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.scroll{overflow-x:auto}.form2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px}
.ing{display:flex;gap:8px;margin:6px 0}.ing select{flex:3}.ing input{flex:1}
.st-published{color:var(--brand);font-weight:600}.st-draft{color:var(--mute)}.pend{color:var(--warn);font-weight:600}
</style>
</head>
<body><div id="app"></div><script src="/config.js"></script><script src="admin.js"></script></body>
</html>
